[project]
name = "interview-pilot"
version = "0.1.0"
description = "Real-time voice mock-interview agent built on LiveKit Agents"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.8",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
